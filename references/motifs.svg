<!-- ═══════════════════════════════════════════════════════════════
     mojo-plate-design · motifs.svg
     Inline this block as the FIRST child of <body>.
     Provides: #boil filter (hand-etched wobble) + symbol library.
     Usage: <svg viewBox="0 0 100 100"><use href="#sunburst"/></svg>
     ═══════════════════════════════════════════════════════════════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- hand-etched boil: turbulence displacement, static seed -->
    <filter id="boil" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence id="boilTurb" type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="1" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
  </defs>

  <!-- etched sunburst: rays + dotted halo -->
  <symbol id="sunburst" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor">
      <circle cx="50" cy="50" r="13" stroke-width="1.6"/>
      <circle cx="50" cy="50" r="21" stroke-width="1" stroke-dasharray="0.5 5" stroke-linecap="round"/>
      <g stroke-width="1.6">
        <line x1="50" y1="2" x2="50" y2="22"/><line x1="50" y1="78" x2="50" y2="98"/>
        <line x1="2" y1="50" x2="22" y2="50"/><line x1="78" y1="50" x2="98" y2="50"/>
        <line x1="16" y1="16" x2="30" y2="30"/><line x1="70" y1="70" x2="84" y2="84"/>
        <line x1="84" y1="16" x2="70" y2="30"/><line x1="30" y1="70" x2="16" y2="84"/>
      </g>
      <g stroke-width="1">
        <line x1="50" y1="28" x2="50" y2="34"/><line x1="50" y1="66" x2="50" y2="72"/>
        <line x1="28" y1="50" x2="34" y2="50"/><line x1="66" y1="50" x2="72" y2="50"/>
      </g>
    </g>
  </symbol>

  <!-- event starburst (celestial chart marker); .burst rotates slowly -->
  <symbol id="evstar" viewBox="0 0 64 64">
    <g class="burst">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="32" y1="2" x2="32" y2="18"/><line x1="32" y1="46" x2="32" y2="62"/>
        <line x1="2" y1="32" x2="18" y2="32"/><line x1="46" y1="32" x2="62" y2="32"/>
        <line x1="11" y1="11" x2="21" y2="21"/><line x1="43" y1="43" x2="53" y2="53"/>
        <line x1="53" y1="11" x2="43" y2="21"/><line x1="21" y1="43" x2="11" y2="53"/>
      </g>
      <circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="0.5 5" stroke-linecap="round"/>
    </g>
    <circle cx="32" cy="32" r="7" fill="currentColor"/>
    <circle cx="32" cy="32" r="11" fill="none" stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <!-- engraved divider rule: hairline · dot · diamond · dot · hairline -->
  <symbol id="rule" viewBox="0 0 230 14">
    <g fill="none" stroke="currentColor" stroke-width="1.2">
      <line x1="0" y1="7" x2="96" y2="7"/>
      <line x1="134" y1="7" x2="230" y2="7"/>
      <path d="M115,1 L121,7 L115,13 L109,7 Z"/>
      <circle cx="101" cy="7" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="129" cy="7" r="1.6" fill="currentColor" stroke="none"/>
    </g>
  </symbol>
</svg>
